<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; display: flex; justify-content: center; align-items: center; width: 1024px; height: 1024px; }
    canvas { display: block; width: 1024px; height: 1024px; }
  </style>
</head>
<body>
  <canvas id="iconCanvas" width="1024" height="1024"></canvas>
  <script>
    const canvas = document.getElementById('iconCanvas');
    const ctx = canvas.getContext('2d');
    const W = 1024;
    const H = 1024;

    function drawGlow(ctx, x, y, radius, color) {
      ctx.save();
      const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
      grad.addColorStop(0, color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawStarFlare(ctx, x, y, size, color) {
      ctx.save();
      ctx.translate(x, y);
      const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 2.5);
      halo.addColorStop(0, color);
      halo.addColorStop(0.3, color.replace(/[\d\.]+\)$/, '0.4)'));
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(0, 0, size * 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = color;
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.ellipse(0, 0, size * 3.5, 3.0, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(0, 0, 3.0, size * 2.2, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.rotate(Math.PI / 4);
      ctx.beginPath();
      ctx.ellipse(0, 0, size * 1.8, 1.8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, size * 0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawIcon() {
      ctx.clearRect(0, 0, W, H);

      // Squircle path for modern OS app icon
      const r = 210; // corner radius
      const margin = 28;
      const x = margin, y = margin, w = W - margin * 2, h = H - margin * 2;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.clip();

      // Background gradient
      const bgGrad = ctx.createRadialGradient(W / 2, 480, 50, W / 2, 512, 680);
      bgGrad.addColorStop(0, '#161d28');
      bgGrad.addColorStop(0.4, '#0e131d');
      bgGrad.addColorStop(0.75, '#07090e');
      bgGrad.addColorStop(1, '#020306');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // Subtle border stroke
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Atmospheric Glow
      drawGlow(ctx, 512, 512, 480, 'rgba(14, 165, 233, 0.18)');
      drawGlow(ctx, 420, 620, 360, 'rgba(168, 85, 247, 0.16)');
      drawGlow(ctx, 640, 512, 340, 'rgba(6, 182, 212, 0.22)');

      // Constellation node parameters
      const cx = 500;
      const cy = 512;
      const S = 1.65; // Scale for icon

      const rawNodes = [
        { id: 'v0', x: -175 * S, y: -205 * S, r: 14, color: '#688ca8', glow: null },
        { id: 'v1', x: -175 * S, y: -105 * S, r: 13, color: '#5b7e9b', glow: null },
        { id: 'v2', x: -175 * S, y: 0,        r: 14, color: '#6285a2', glow: null },
        { id: 'v3', x: -175 * S, y: 105 * S,  r: 13, color: '#7a70a8', glow: 'rgba(168, 85, 247, 0.6)' },
        { id: 'v4', x: -175 * S, y: 205 * S,  r: 15, color: '#8b6ebd', glow: 'rgba(168, 85, 247, 0.8)' },

        { id: 't1', x: -70 * S,  y: -140 * S, r: 14, color: '#678da9', glow: null },
        { id: 't2', x: 30 * S,   y: -75 * S,  r: 14, color: '#6696b5', glow: null },
        { id: 't3', x: 125 * S,  y: -12 * S,  r: 15, color: '#60a5ca', glow: null },

        { id: 'b1', x: -75 * S,  y: 145 * S,  r: 14, color: '#6b7da5', glow: 'rgba(129, 140, 248, 0.5)' },
        { id: 'b2', x: 25 * S,   y: 85 * S,   r: 14, color: '#5b8eab', glow: null },

        { id: 'in_top_glow', x: -75 * S, y: -65 * S, r: 19, color: '#ffffff', glow: '#00F0FF', coreGlow: 38, flare: true, flareSize: 28 },
        { id: 'in_mid_v',    x: -75 * S, y: 35 * S,  r: 13, color: '#6488a7', glow: null },
        { id: 'in_right_glow', x: 95 * S, y: 35 * S, r: 20, color: '#ffffff', glow: '#22D3EE', coreGlow: 42, flare: true, flareSize: 32 },
        { id: 'in_sub_mid',   x: 10 * S,  y: 5 * S,   r: 13, color: '#6293b2', glow: null },

        { id: 'apex', x: 225 * S, y: 65 * S, r: 22, color: '#ffffff', glow: '#38BDF8', coreGlow: 50, flare: true, flareSize: 38 }
      ];

      const nodeMap = {};
      rawNodes.forEach(n => {
        n.absX = cx + n.x;
        n.absY = cy + n.y;
        nodeMap[n.id] = n;
      });

      const edges = [
        ['v0', 'v1'], ['v1', 'v2'], ['v2', 'v3'], ['v3', 'v4'],
        ['v0', 't1'], ['t1', 't2'], ['t2', 't3'], ['t3', 'apex'],
        ['v4', 'b1'], ['b1', 'b2'], ['b2', 'apex'],
        ['v0', 'in_top_glow'], ['v1', 'in_top_glow'], ['v2', 'in_top_glow'],
        ['t1', 'in_top_glow'], ['t2', 'in_top_glow'], ['in_top_glow', 'in_sub_mid'],
        ['v2', 'in_mid_v'], ['v3', 'in_mid_v'], ['v4', 'in_mid_v'],
        ['b1', 'in_mid_v'], ['in_mid_v', 'in_sub_mid'],
        ['in_sub_mid', 'in_right_glow'], ['t2', 'in_right_glow'],
        ['t3', 'in_right_glow'], ['b2', 'in_right_glow'],
        ['in_right_glow', 'apex'], ['t3', 'b2']
      ];

      // Draw edges
      edges.forEach(([idA, idB]) => {
        const a = nodeMap[idA];
        const b = nodeMap[idB];
        if (!a || !b) return;

        const lineGrad = ctx.createLinearGradient(a.absX, a.absY, b.absX, b.absY);
        const colA = a.glow ? (a.glow.startsWith('#') ? a.glow : a.glow) : 'rgba(80, 135, 175, 0.45)';
        const colB = b.glow ? (b.glow.startsWith('#') ? b.glow : b.glow) : 'rgba(80, 135, 175, 0.45)';
        lineGrad.addColorStop(0, colA);
        lineGrad.addColorStop(1, colB);

        ctx.strokeStyle = lineGrad;
        ctx.lineWidth = 4.2;
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = (a.glow || b.glow) ? 16 : 5;
        ctx.beginPath();
        ctx.moveTo(a.absX, a.absY);
        ctx.lineTo(b.absX, b.absY);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.lineWidth = 1.4;
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(a.absX, a.absY);
        ctx.lineTo(b.absX, b.absY);
        ctx.stroke();
      });

      // Draw nodes
      rawNodes.forEach(n => {
        ctx.save();
        if (n.glow) {
          drawGlow(ctx, n.absX, n.absY, n.r * 3.5, n.glow);
        }

        ctx.beginPath();
        ctx.arc(n.absX, n.absY, n.r, 0, Math.PI * 2);

        if (n.coreGlow) {
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = n.glow || '#00F0FF';
          ctx.shadowBlur = n.coreGlow;
          ctx.fill();

          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 3.5;
          ctx.stroke();
        } else {
          ctx.fillStyle = n.color;
          ctx.shadowColor = n.glow || 'rgba(0, 240, 255, 0.3)';
          ctx.shadowBlur = n.glow ? 15 : 6;
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
          ctx.lineWidth = 1.8;
          ctx.stroke();
        }
        ctx.restore();

        if (n.flare) {
          drawStarFlare(ctx, n.absX, n.absY, n.flareSize, n.glow || 'rgba(0, 240, 255, 0.9)');
        }
      });

      ctx.restore();
    }

    drawIcon();
  </script>
</body>
</html>
